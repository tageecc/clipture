name: Bug report / 问题反馈
description: Report a reproducible Clipture problem / 反馈可以复现的问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Clipture. Remove private screenshot and clipboard content before posting.
        感谢反馈。公开提交前请移除截图和剪贴板中的隐私内容。
  - type: input
    id: version
    attributes:
      label: Clipture version / Clipture 版本
      placeholder: e.g. 1.1.29
    validations:
      required: true
  - type: dropdown
    id: distribution
    attributes:
      label: Distribution / 安装渠道
      options:
        - Direct download / 官网版
        - Mac App Store
        - Development build / 开发版
    validations:
      required: true
  - type: input
    id: mac
    attributes:
      label: macOS, Mac model, and chip / macOS、Mac 型号与芯片
      placeholder: e.g. macOS 15.6, MacBook Pro, Apple M3 / Intel
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / 复现步骤
      placeholder: |
        1. Open…
        2. Click…
        3. See…
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed result / 实际结果
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result / 预期结果
    validations:
      required: true
  - type: textarea
    id: attachments
    attributes:
      label: Redacted screenshots or logs / 已移除隐私的截图或日志
      description: Optional. Do not post payment, license, clipboard, or private screenshot content.
