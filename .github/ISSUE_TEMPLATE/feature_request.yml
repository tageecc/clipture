name: Feature request / 功能建议
description: Suggest an improvement to an existing workflow / 提出功能或体验建议
title: "[Idea] "
labels: ["enhancement"]
body:
  - type: textarea
    id: workflow
    attributes:
      label: Current workflow / 当前使用方式
      description: What are you trying to accomplish, and where does the current workflow slow you down?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested change / 建议如何改进
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context / 其他信息
      description: Optional screenshots, examples, or related apps. Remove private content before uploading.
