name: Feature request / 功能建议
description: Suggest a concrete workflow improvement / 提出具体的使用体验改进
title: "[Idea] "
labels: ["enhancement"]
body:
  - type: textarea
    id: workflow
    attributes:
      label: Current workflow / 当前使用方式
      description: What are you trying to finish, and where does the current workflow slow you down?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested change / 建议如何改进
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context / 其他信息
      description: Optional examples or related apps. Remove private content before uploading.
